<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/6cb7ca6f12.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Document</title>

  <body>
    <div class="container sign-up">
      <header>
        <div class="lang">
          <h6>English</h6>
          <div><i class="fa-solid fa-angle-down down-arrow"></i></div>
        </div>
      </header>
      <main>
        <div class="logos-instagram">
          <img src="/Images/logos_instagram.png" alt="Instragram Logo" />
        </div>
        <p class="signup-message">
          Sign up to see photos videos and reels from your friends.
        </p>
        <div class="signup-with-facebook">
          <a href="/index.html"
            ><i class="fa-brands fa-facebook-f"></i> Continue as shalini</a
          >
        </div>
        <div class="or">
          <div class="dash"></div>
          <span> OR </span>
          <div class="dash"></div>
        </div>
        <a href="" class="signup-phone-email">Sign Up With Phone or Email</a>
      </main>
      <footer>
        <div class="signup-footer">
          <h5>Already have an account?</h5>
          <a href="">Sign in.</a>
        </div>
      </footer>
    </div>
  </body>
